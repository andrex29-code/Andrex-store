<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANDREX Store</title>

<style>

:root{
  --gold:#d6a63a;
  --gold2:#f4d47a;
  --bg:#080808;
  --card:#111;
  --text:#fff;
  --muted:#aaa;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button{
  font-family:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:900;
  background:rgba(8,8,8,.96);
  border-bottom:1px solid #292929;
  padding:15px 18px;
  text-align:center;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--gold2);
}

.sublogo{
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}

/* VIDEO */

.video-container{
  width:100%;
  max-width:900px;
  margin:20px auto;
  padding:0 15px;
}

.video-container video{
  width:100%;
  max-height:480px;
  border-radius:18px;
  display:block;
  background:#000;
  object-fit:cover;
}

/* INICIO */

.inicio{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 100px;
}

.titulo{
  text-align:center;
  margin:25px 0 8px;
  font-size:27px;
}

.descripcion{
  text-align:center;
  color:var(--muted);
  margin:0 auto 30px;
}

/* CATEGORIAS */

.categorias{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.categoria{
  position:relative;
  min-height:210px;
  border:1px solid #333;
  border-radius:20px;
  overflow:hidden;
  background:#111;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.categoria:hover{
  transform:translateY(-4px);
  border-color:var(--gold);
}

.categoria img{
  width:100%;
  height:100%;
  min-height:210px;
  object-fit:cover;
  display:block;
  opacity:.62;
}

.categoria-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:20px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  );
}

.categoria-icono{
  font-size:35px;
}

.categoria h2{
  margin:5px 0;
  font-size:25px;
}

.categoria span{
  color:var(--gold2);
  font-size:14px;
}

/* CATALOGO */

.catalogo{
  display:none;
  max-width:1150px;
  margin:auto;
  padding:20px 15px 120px;
}

.catalogo.activo{
  display:block;
}

.boton-volver{
  border:1px solid var(--gold);
  background:#111;
  color:white;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:20px;
}

.boton-volver:hover{
  background:var(--gold);
  color:#000;
}

.titulo-categoria{
  text-align:center;
  color:var(--gold2);
  margin-bottom:8px;
  font-size:29px;
}

.descripcion-categoria{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

/* PRODUCTOS */

.productos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.producto{
  background:var(--card);
  border:1px solid #292929;
  border-radius:16px;
  overflow:hidden;
  padding-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.producto img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#050505;
}

.producto-info{
  padding:12px;
}

.producto-nombre{
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px;
}

.producto-precio{
  color:var(--gold2);
  font-weight:bold;
  margin-bottom:10px;
}

.boton-consultar,
.agregar-carrito{
  width:100%;
  border:none;
  border-radius:9px;
  padding:11px;
  margin-top:7px;
  cursor:pointer;
  font-weight:bold;
}

.boton-consultar{
  background:#222;
  color:white;
}

.agregar-carrito{
  background:var(--gold);
  color:#000;
}

.agregar-carrito:hover{
  background:var(--gold2);
}

/* MENSAJE SIN PRODUCTOS */

.sin-productos{
  text-align:center;
  padding:50px 20px;
  border:1px dashed #444;
  border-radius:15px;
  color:#aaa;
}

/* CARRITO */

.carrito-boton{
  position:fixed;
  right:18px;
  bottom:18px;
  width:64px;
  height:64px;
  border-radius:50%;
  border:2px solid var(--gold2);
  background:#111;
  color:white;
  font-size:28px;
  cursor:pointer;
  z-index:2000;
  box-shadow:0 5px 30px rgba(0,0,0,.7);
}

.carrito-boton:hover{
  transform:scale(1.05);
}

.carrito-contador{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#e53935;
  color:white;
  width:24px;
  height:24px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

/* FONDO CARRITO */

.carrito-fondo{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:3000;
  display:none;
}

.carrito-fondo.activo{
  display:block;
}

/* PANEL */

.carrito-panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(430px,94vw);
  background:#101010;
  border-left:1px solid #333;
  padding:20px;
  overflow-y:auto;
  box-shadow:-10px 0 40px rgba(0,0,0,.5);
}

.carrito-cabecera{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #333;
  padding-bottom:15px;
}

.carrito-cabecera h2{
  margin:0;
  color:var(--gold2);
}

.cerrar-carrito{
  background:none;
  border:none;
  color:white;
  font-size:27px;
  cursor:pointer;
}

/* ITEMS */

.carrito-item{
  display:flex;
  gap:10px;
  padding:15px 0;
  border-bottom:1px solid #292929;
}

.carrito-item img{
  width:70px;
  height:70px;
  border-radius:10px;
  object-fit:cover;
}

.carrito-item-info{
  flex:1;
}

.carrito-item-nombre{
  font-weight:bold;
  margin-bottom:5px;
}

.carrito-item-precio{
  color:var(--gold2);
  font-size:14px;
}

.cantidad{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.cantidad button{
  width:27px;
  height:27px;
  border-radius:6px;
  border:1px solid #555;
  background:#222;
  color:white;
  cursor:pointer;
}

.eliminar{
  color:#ff6666;
  background:none;
  border:none;
  cursor:pointer;
  font-size:18px;
}

/* TOTAL */

.carrito-total{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #444;
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
}

#totalCarrito{
  color:var(--gold2);
}

.whatsapp-carrito{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#25D366;
  color:#fff;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.vaciar-carrito{
  width:100%;
  margin-top:9px;
  padding:11px;
  border:1px solid #555;
  border-radius:10px;
  background:#171717;
  color:#ccc;
  cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:850px){

  .productos{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:600px){

  .categorias{
    grid-template-columns:1fr;
  }

  .categoria{
    min-height:190px;
  }

  .categoria img{
    min-height:190px;
  }

  .productos{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .producto-info{
    padding:9px;
  }

  .producto-nombre{
    font-size:14px;
  }

  .producto-precio{
    font-size:14px;
  }

  .agregar-carrito,
  .boton-consultar{
    font-size:12px;
    padding:10px 5px;
  }

  .titulo{
    font-size:24px;
  }

}

@media(max-width:380px){

  .productos{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

}

</style>
</head>

<body>

<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBGb7jgkOKWeNnJed6QPDMW4-933gGk59I",

  authDomain:
    "andrex-store.firebaseapp.com",

  projectId:
    "andrex-store",

  storageBucket:
    "andrex-store.firebasestorage.app",

  messagingSenderId:
    "607192665861",

  appId:
    "1:607192665861:web:a4fb90f3a2009d6491716c"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =========================================
   VARIABLES
========================================= */

let productosTodos = [];

let categoriaActual = "";

let carrito =
  JSON.parse(
    localStorage.getItem("andrexCarrito")
  ) || [];


/* =========================================
   NORMALIZAR CATEGORIA
========================================= */

function normalizarCategoria(valor){

  if(!valor) return "";

  const texto =
    String(valor)
      .trim()
      .toLowerCase();

  if(
    texto === "ropa" ||
    texto === "ropas"
  ){

    return "Ropa";

  }

  if(
    texto === "zapato" ||
    texto === "zapatos"
  ){

    return "Zapatos";

  }

  if(
    texto === "locion" ||
    texto === "lociones" ||
    texto === "perfume" ||
    texto === "perfumes"
  ){

    return "Lociones";

  }

  if(
    texto === "streaming"
  ){

    return "Streaming";

  }

  return valor;

}


/* =========================================
   PRECIO
========================================= */

function convertirPrecio(precio){

  if(
    precio === undefined ||
    precio === null ||
    precio === ""
  ){

    return 0;

  }

  if(typeof precio === "number"){

    return precio;

  }

  let limpio =
    String(precio)
      .replace(/[^\d]/g,"");

  return Number(limpio) || 0;

}


function formatoPrecio(numero){

  return "$" +
    Number(numero || 0)
      .toLocaleString("es-CO");

}


/* =========================================
   OBTENER IMAGEN
========================================= */

function obtenerImagen(producto){

  return (
    producto.imagen ||
    producto.image ||
    producto.foto ||
    producto.url ||
    producto.imageUrl ||
    ""
  );

}


/* =========================================
   OBTENER NOMBRE
========================================= */

function obtenerNombre(producto){

  return (
    producto.nombre ||
    producto.name ||
    producto.titulo ||
    "Producto"
  );

}


/* =========================================
   CARGAR PRODUCTOS
========================================= */

async function cargarProductos(){

  const contenedor =
    document.getElementById("productos");

  try{

    const snapshot =
      await getDocs(
        collection(db,"productos")
      );


    productosTodos = [];


    snapshot.forEach(doc => {

      const producto =
        doc.data();

      productosTodos.push({

        id: doc.id,

        ...producto

      });

    });


    console.log(
      "Productos cargados:",
      productosTodos
    );


  }catch(error){

    console.error(
      "Error cargando productos:",
      error
    );

    /*
      Si tu colección de Firebase
      tiene otro nombre, solamente
      cambia "productos" arriba.
    */

  }

}


/* =========================================
   ABRIR CATEGORIA
========================================= */

window.abrirCategoria =
function(categoria){

  categoriaActual =
    normalizarCategoria(categoria);


  document
    .getElementById("inicio")
    .style.display = "none";


  document
    .getElementById("catalogo")
    .classList.add("activo");


  document
    .getElementById("tituloCategoria")
    .textContent =
      categoriaActual;


  document
    .getElementById("descripcionCategoria")
    .textContent =
      "Productos disponibles en " +
      categoriaActual;


  mostrarProductos();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================================
   MOSTRAR PRODUCTOS
========================================= */

function mostrarProductos(){

  const contenedor =
    document.getElementById("productos");


  contenedor.innerHTML = "";


  const productos =
    productosTodos.filter(producto => {

      const categoriaProducto =
        normalizarCategoria(
          producto.categoria ||
          producto.category ||
          producto.tipo
        );

      return categoriaProducto ===
        categoriaActual;

    });


  if(productos.length === 0){

    contenedor.innerHTML = `

      <div
        class="sin-productos"
        style="grid-column:1/-1">

        <div style="font-size:40px">
          📦
        </div>

        <h3>
          Todavía no hay productos
        </h3>

        <p>
          Cuando agregues productos de
          ${categoriaActual},
          aparecerán aquí.
        </p>

      </div>

    `;

    return;

  }


  productos.forEach(
    (producto,numero) => {

      const imagen =
        obtenerImagen(producto);

      const nombre =
        obtenerNombre(producto);

      const precio =
        convertirPrecio(
          producto.precio ||
          producto.price ||
          0
        );


      const tarjeta =
        document.createElement("div");

      tarjeta.className =
        "producto";


      tarjeta.innerHTML = `

        <img
          src="${imagen}"
          alt="${nombre}"
          onerror="this.style.display='none'">


        <div class="producto-info">

          <div class="producto-nombre">

            ${nombre}

          </div>


          <div class="producto-precio">

            ${
              precio > 0
              ? formatoPrecio(precio)
              : "Consultar precio"
            }

          </div>


          <button
            class="boton-consultar"
            onclick="consultarProducto('${escapar(nombre)}')">

            💬 Consultar

          </button>


          <button
            class="agregar-carrito"
            onclick='agregarAlCarrito(${JSON.stringify({
              id:producto.id,
              nombre:nombre,
              precio:precio,
              imagen:imagen,
              categoria:categoriaActual
            })})'>

            🛒 Agregar al carrito

          </button>

        </div>

      `;


      contenedor.appendChild(
        tarjeta
      );

    }
  );

}


/* =========================================
   ESCAPAR TEXTO
========================================= */

function escapar(texto){

  return String(texto)
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"');

}


/* =========================================
   CONSULTAR PRODUCTO
========================================= */

window.consultarProducto =
function(nombre){

  const numero =
    "573181579324";


  const mensaje =
    `Hola, estoy interesado en el producto "${nombre}" de ANDREX Store. ¿Me pueden dar información?`;


  const url =
    `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;


  window.open(
    url,
    "_blank"
  );

};


/* =========================================
   AGREGAR AL CARRITO
========================================= */

window.agregarAlCarrito =
function(producto){

  const existente =
    carrito.find(
      item =>
        item.id === producto.id
    );


  if(existente){

    existente.cantidad++;

  }else{

    carrito.push({

      ...producto,

      cantidad:1

    });

  }


  guardarCarrito();

  actualizarCarrito();


  /*
    Abrimos el carrito automáticamente
    para que el cliente vea que el producto
    fue agregado.
  */

  abrirCarrito();

};


/* =========================================
   GUARDAR CARRITO
========================================= */

function guardarCarrito(){

  localStorage.setItem(
    "andrexCarrito",
    JSON.stringify(carrito)
  );

}


/* =========================================
   ACTUALIZAR CARRITO
========================================= */

function actualizarCarrito(){

  const contador =
    document.getElementById(
      "carritoContador"
    );


  const lista =
    document.getElementById(
      "listaCarrito"
    );


  const total =
    document.getElementById(
      "totalCarrito"
    );


  const cantidadTotal =
    carrito.reduce(
      (suma,item) =>
        suma + item.cantidad,
      0
    );


  contador.textContent =
    cantidadTotal;


  lista.innerHTML = "";


  let totalCompra = 0;


  if(carrito.length === 0){

    lista.innerHTML = `

      <div
        style="
        text-align:center;
        padding:40px 10px;
        color:#aaa">

        <div style="font-size:50px">
          🛒
        </div>

        <p>
          Tu carrito está vacío.
        </p>

        <p style="font-size:13px">
          Agrega productos para verlos aquí.
        </p>

      </div>

    `;

  }


  carrito.forEach(
    (item,index) => {

      totalCompra +=
        item.precio *
        item.cantidad;


      const elemento =
        document.createElement("div");

      elemento.className =
        "carrito-item";


      elemento.innerHTML = `

        <img
          src="${item.imagen}"
          alt="${item.nombre}">


        <div
          class="carrito-item-info">

          <div
            class="carrito-item-nombre">

            ${item.nombre}

          </div>


          <div
            class="carrito-item-precio">

            ${
              item.precio > 0
              ? formatoPrecio(item.precio)
              : "Consultar precio"
            }

          </div>


          <div class="cantidad">

            <button
              onclick="cambiarCantidad(${index},-1)">

              −

            </button>


            <span>

              ${item.cantidad}

            </span>


            <button
              onclick="cambiarCantidad(${index},1)">

              +

            </button>


            <button
              class="eliminar"
              onclick="eliminarDelCarrito(${index})">

              🗑️

            </button>

          </div>

        </div>

      `;


      lista.appendChild(
        elemento
      );

    }
  );


  total.textContent =
    formatoPrecio(totalCompra);

}


/* =========================================
   CAMBIAR CANTIDAD
========================================= */

window.cambiarCantidad =
function(index,cambio){

  carrito[index].cantidad +=
    cambio;


  if(
    carrito[index].cantidad <= 0
  ){

    carrito.splice(index,1);

  }


  guardarCarrito();

  actualizarCarrito();

};


/* =========================================
   ELIMINAR
========================================= */

window.eliminarDelCarrito =
function(index){

  carrito.splice(
    index,
    1
  );


  guardarCarrito();

  actualizarCarrito();

};


/* =========================================
   VACIAR
========================================= */

window.vaciarCarrito =
function(){

  if(carrito.length === 0){

    return;

  }


  carrito = [];


  guardarCarrito();

  actualizarCarrito();

};


/* =========================================
   ABRIR CARRITO
========================================= */

window.abrirCarrito =
function(){

  document
    .getElementById("carritoFondo")
    .classList.add("activo");

};


/* =========================================
   CERRAR CARRITO
========================================= */

window.cerrarCarrito =
function(){

  document
    .getElementById("carritoFondo")
    .classList.remove("activo");

};


window.cerrarCarritoDesdeFondo =
function(event){

  if(
    event.target.id ===
    "carritoFondo"
  ){

    cerrarCarrito();

  }

};


/* =========================================
   WHATSAPP
========================================= */

window.enviarPedidoWhatsApp =
function(){

  if(carrito.length === 0){

    alert(
      "Tu carrito está vacío."
    );

    return;

  }


  const numero =
    "573181579324";


  let mensaje =
    "Hola, quiero realizar este pedido en ANDREX Store:%0A%0A";


  let total =
    0;


  carrito.forEach(item => {

    const subtotal =
      item.precio *
      item.cantidad;


    total += subtotal;


    mensaje +=
      `• ${item.nombre} x${item.cantidad}`;


    if(item.precio > 0){

      mensaje +=
        ` - ${formatoPrecio(subtotal)}`;

    }


    mensaje +=
      "%0A";

  });


  mensaje +=
    `%0ATotal: ${formatoPrecio(total)}`;


  const url =
    `https://wa.me/${numero}?text=${mensaje}`;


  window.open(
    url,
    "_blank"
  );

};


/* =========================================
   VOLVER
========================================= */

window.volverInicio =
function(){

  document
    .getElementById("catalogo")
    .classList.remove("activo");


  document
    .getElementById("inicio")
    .style.display = "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================================
   INICIAR
========================================= */

actualizarCarrito();

cargarProductos()
  .then(() => {

    if(categoriaActual){

      mostrarProductos();

    }

  });

</script>

</body>
</html>
